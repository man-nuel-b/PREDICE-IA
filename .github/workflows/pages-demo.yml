name: Publicar vista previa de Predice-IA en GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'index.html'
      - 'legacy/**'
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar-demostracion:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Verificar que se publica la interfaz mejorada
        run: |
          cmp index.html demo/index.html
          grep -q 'Analítica avanzada' index.html
          grep -q 'VISTA PREVIA ANALÍTICA' index.html
      - name: Habilitar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar vista previa estática
        uses: actions/upload-pages-artifact@v4
        with:
          path: './demo'
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
