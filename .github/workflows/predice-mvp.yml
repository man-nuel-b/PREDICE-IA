name: Predice-IA MVP CI
on:
  push:
    paths:
      - 'mvp/**'
      - '.github/workflows/predice-mvp.yml'
  pull_request:
    paths:
      - 'mvp/**'
      - '.github/workflows/predice-mvp.yml'
permissions:
  contents: read
jobs:
  engine-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python compile
        working-directory: mvp
        run: python -m compileall -q engine.py demo.py server.py
      - name: Engine and API regressions
        working-directory: mvp
        run: python -m unittest discover -s tests -v
      - name: Front-end syntax
        run: |
          node --check mvp/web/app.js
          node --check mvp/web/csv-import.js
          node --test mvp/tests/csv_import.test.cjs
          node --check mvp/web/advanced-analytics.js
          node --check mvp/web/advanced-ui.js
          node --test mvp/tests/advanced.test.cjs
